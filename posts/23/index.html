<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thanks giving</title>
    <link rel="stylesheet" href="/style.css?v=1791134865">
</head>
<body class="">
    <main>
        <h1><em>Thanks giving</em></h1>
<p>God! I thank Thee for my birth in this world of rosy
dawns, flame-clad sunsets and thick forests wherein the
gloom of nature’s bygone nights rests in eternal sleep!</p>
<p>October-(2026) 1200–1600</p>
    </main>
    <footer>
        <a href="/posts/"><i>../</i></a>
        <div id="clock-container"></div>
    </footer>
    <script>
        const patterns = ['mor_0702.jpg', 'mor_0411.jpg', 'mor_1208.jpg', 'mor_1114.jpg', 'mor_0912.jpg', 'ind_0215.jpg', 'ind_0235.jpg', 'ind_0417.jpg', 'ind_0415.jpg', 'isl_0101.jpg', 'isl_0202.jpg', 'isl_0303.jpg'];
        const randomPattern = patterns[Math.floor(Math.random() * patterns.length)];
        const sidePatternEl = document.getElementById('home-image');
        if (sidePatternEl) {
            sidePatternEl.style.backgroundImage = "url('/" + randomPattern + "')";
        }
        
        function updateClock() {
            const timeStr = new Date().toLocaleTimeString('en-US');
            const el = document.getElementById('clock-container');
            if (el) el.innerText = timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
